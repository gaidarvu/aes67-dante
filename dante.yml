- name: Install Dante
  become: true
  hosts: all
  gather_facts: true
  handlers:
  - name: Restart aes67-daemon service
    systemd:
      name: aes67-daemon
      state: restarted
  - name: Restart Lyra service
    systemd:
      daemon_reload: true
      name: '{{ service_name }}.service'
      state: restarted
  - name: Reboot host
    reboot:
      reboot_timeout: 180

  tasks:
    - name: Get network settings
      set_fact:
        dante_ip: "{{ octet_1 }}.{{ octet_2 }}.\
                   {{ ansible_default_ipv4.address.split('.')[2] }}.\
                   {{ ansible_default_ipv4.address.split('.')[3] }}"
        vlan30_ip: "{{ ansible_default_ipv4.address.split('.')[0] }}.\
                 30.{{ ansible_default_ipv4.address.split('.')[2] }}.\
                    {{ ansible_default_ipv4.address.split('.')[3] }}"
        vlan2_ip: "{{ ansible_default_ipv4.address.split('.')[0] }}.\
                 2.{{ ansible_default_ipv4.address.split('.')[2] }}.\
                    {{ ansible_default_ipv4.address.split('.')[3] }}"

    - name: Purge PulseAudio
      apt:
        name: pulseaudio
        state: absent
        purge: true
        autoremove: true

    - name: Remove PulseAudio trash
      file:
        path: "{{ item }}"
        state: absent
      with_items:
        - /etc/pulse/
        - /home/mvs/.config/pulse/

    - name: Copy aes67-full
      copy:
        src: "{{ item.pkg }}"
        dest: /tmp/aes67-full.deb
        mode: '0644'
      loop:
        - {pkg: "aes67_full_v2.2.0_amd64.deb", arch: 'x86_64'}
        - {pkg: "aes67_full_arm64.deb", arch: 'aarch64'}
      when: ansible_architecture == item.arch

    - name: Install aes67-full
      apt:
        deb: /tmp/aes67-full.deb
        update_cache: true
      notify: Reboot host

    - name: Copy netplan config
      template:
        src: "{{ item.src }}"
        dest: /etc/netplan/{{ item.dest }}
        mode: '0644'
      notify: Apply Netplan configuration
      when: inventory_hostname in groups[item.group]
      with_items:
        - {src: './template/netplan.tap.j2', group: 'tap', dest: '00-installer-config.yaml'}
        - {src: './template/netplan.gers.j2', group: 'gers', dest: '00-installer-config.yaml'}
        - {src: './template/netplan.orange.j2', group: 'orange', dest: 'orangepi-default.yaml'}
      notify: Reboot host

    - name: Copy aes config
      template:
        src: ./template/daemon.conf.j2
        dest: /etc/aes67-daemon/daemon.conf
        mode: '0755'
      notify: Reboot host

    - name: Copy aes sound source
      template:
        src: ./template/status.json.j2
        dest: /var/lib/aes67-daemon/status.json
        mode: '0755'
        owner: aes67-daemon
        group: aes67-daemon
      when: inventory_hostname in groups['tap']

    - name: Make overrigde directory
      file:
        path: /etc/systemd/system/{{ service_name }}.service.d
        state: directory
        mode: '0755'

    - name: Create the override configuration
      template:
        src: ./template/override.conf.j2
        dest: /etc/systemd/system/{{ service_name }}.service.d/override.conf
        mode: '0755'
      notify: Restart Lyra service

    - name: Set sysctl parameters
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        reload: true
      when: inventory_hostname in groups[item.group]
      with_items:
        - {name: 'kernel.sched_rt_runtime_us', value: '1000000', group: 'tap'}
        - {name: 'kernel.perf_cpu_time_max_percent', value: '0', group: 'tap'}
        - {name: 'net.core.wmem_max', value: '12582912', group: 'gers'}
        - {name: 'net.core.rmem_max', value: '12582912', group: 'gers'}
        - {name: 'net.ipv4.tcp_rmem', value: '10240 87380 12582912', group: 'gers'}
        - {name: 'net.ipv4.tcp_wmem', value: '10240 87380 12582912', group: 'gers'}
        - {name: 'net.ipv4.tcp_window_scaling', value: '1', group: 'gers'}
        - {name: 'net.ipv4.tcp_timestamps', value: '1', group: 'gers'}
        - {name: 'net.core.netdev_max_backlog', value: '5000', group: 'gers'}
        - {name: 'net.core.wmem_max', value: '12582912', group: 'orange'}
        - {name: 'net.core.rmem_max', value: '12582912', group: 'orange'}
        - {name: 'net.ipv4.tcp_rmem', value: '10240 87380 12582912', group: 'orange'}
        - {name: 'net.ipv4.tcp_wmem', value: '10240 87380 12582912', group: 'orange'}
        - {name: 'net.ipv4.tcp_window_scaling', value: '1', group: 'orange'}
        - {name: 'net.ipv4.tcp_timestamps', value: '1', group: 'orange'}
        - {name: 'net.core.netdev_max_backlog', value: '5000', group: 'orange'}
      notify: Reboot host
